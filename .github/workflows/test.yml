name: Contracts

on:
  push:
    paths: ["src/**", "test/**", "script/**", "foundry.toml", ".github/workflows/test.yml"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts
      - uses: foundry-rs/foundry-toolchain@v1
      - run: forge test -vv
